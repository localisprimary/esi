name: Update ESI Schema

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate, build, and test
        run: pnpm compile

      - name: Check for meaningful generated changes
        id: generated-check
        run: |
          if git diff --quiet -- src/ README.md; then
            echo "meaningful=false" >> $GITHUB_OUTPUT
            echo "No meaningful generated changes detected, skipping PR"
          else
            echo "meaningful=true" >> $GITHUB_OUTPUT
          fi

          # COMPATIBILITY_DATE only changes when ESI publishes a new API
          # version, which ESI reserves for breaking changes.
          if git diff --quiet -G COMPATIBILITY_DATE -- src/client.ts; then
            echo "change-type=patch" >> $GITHUB_OUTPUT
          else
            echo "change-type=major" >> $GITHUB_OUTPUT
            echo "ESI compatibility date changed; using a major changefile"
          fi

      - name: Summarize method changes
        if: steps.generated-check.outputs.meaningful == 'true'
        run: |
          list_methods() { grep -oP '^  async \K\w+' | sort; }
          git show HEAD:src/client.ts | list_methods > "$RUNNER_TEMP/old-methods.txt"
          list_methods < src/client.ts > "$RUNNER_TEMP/new-methods.txt"
          added=$(comm -13 "$RUNNER_TEMP/old-methods.txt" "$RUNNER_TEMP/new-methods.txt")
          removed=$(comm -23 "$RUNNER_TEMP/old-methods.txt" "$RUNNER_TEMP/new-methods.txt")
          date_pattern="COMPATIBILITY_DATE = '\K[0-9-]+"
          old_date=$(git show HEAD:src/client.ts | grep -oP "$date_pattern")
          new_date=$(grep -oP "$date_pattern" src/client.ts)
          git show HEAD:src/types.ts > "$RUNNER_TEMP/old-types.ts"
          enum_changes=$(node scripts/summarize-enum-changes.ts "$RUNNER_TEMP/old-types.ts" src/types.ts)

          format_list() {
            if [ -z "$1" ]; then echo "_None_"; else echo "$1" | sed 's/.*/- `&()`/'; fi
          }

          {
            echo "## ESI Schema Update"
            echo
            echo "This PR contains an automated update to the EVE ESI schema."
            echo
            if [ "$old_date" != "$new_date" ]; then
              echo "> [!WARNING]"
              echo "> ESI compatibility date changed from \`$old_date\` to \`$new_date\`."
              echo "> This is a new API version and uses a **major** changefile."
              echo "> Check removed routes and update the live tests before merging."
              echo
            else
              echo "ESI compatibility date: \`$new_date\` (unchanged; ESI has not published a newer version)."
              echo
            fi
            echo "### Added methods ($(echo -n "$added" | grep -c '^' || true))"
            echo
            format_list "$added"
            echo
            echo "### Removed or renamed methods ($(echo -n "$removed" | grep -c '^' || true))"
            echo
            format_list "$removed"
            echo
            echo "$enum_changes"
            echo
            echo "### Before merging"
            echo
            echo "- [ ] Do the [Naming Review]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/master/AGENTS.md#naming-review) on the added methods and push fixes to this branch."
            echo "- [ ] Confirm removed methods are actual ESI removals, not unintended renames."
            echo "- [ ] Check removed enum values; removing a value consumers may compare against is breaking."
          } > "$RUNNER_TEMP/pr-body.md"

          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit generated changes
        if: steps.generated-check.outputs.meaningful == 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          git add -A
          git commit -m "chore: Update ESI schema and generated files"

      - name: Create changefile
        if: steps.generated-check.outputs.meaningful == 'true'
        run: |
          pnpm beachball change \
            --branch master \
            --type ${{ steps.generated-check.outputs.change-type }} \
            --dependent-change-type patch \
            --message "Automated: Update ESI OpenAPI schema" \
            --no-commit

      - name: Create Pull Request
        if: steps.generated-check.outputs.meaningful == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Update EVE ESI schema

            🤖 Automated update from latest ESI OpenAPI schema
          title: 'chore: Update EVE ESI schema'
          body-path: ${{ runner.temp }}/pr-body.md
          branch: automated/update-esi-schema
          branch-suffix: timestamp
          delete-branch: true
